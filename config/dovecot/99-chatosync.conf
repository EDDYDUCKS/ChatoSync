# ChatoSync - Dovecot 2.4.x (Debian 13 Trixie) compatible config
# NOTA: En Dovecot 2.4 cambiaron los nombres de varios parámetros:
#   disable_plaintext_auth -> auth_allow_cleartext
#   mail_location          -> mail_driver + mail_path
auth_allow_cleartext = yes
mail_driver = maildir
mail_path = ~/Maildir

# ChatoSync - Dovecot 2.4.x (Debian 13 Trixie) compatible config
# NOTA: En Dovecot 2.4 los parámetros globales fueron reemplazados:
#   disable_plaintext_auth -> auth_allow_cleartext
#   mail_location (global) -> namespace inbox { location = ... }
auth_allow_cleartext = yes
namespace inbox {
  location = maildir:~/Maildir
}
